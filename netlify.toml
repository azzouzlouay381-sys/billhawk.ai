# netlify.toml — BillHawk AI deployment configuration
# Netlify automatically uses the modern OpenNext adapter for Next.js 14+ out of the box.

[build]
  command   = "npm run build"
  publish   = ".next"

[build.environment]
  # Force Node 20 for Next.js 14 compatibility
  NODE_VERSION = "20"

# Security headers — important for a privacy-first product
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    # Note: I changed connect-src to just 'self' because your frontend 
    # only talks to your own /api/analyze-bill route, not OpenAI directly.
    Content-Security-Policy    = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self';"
